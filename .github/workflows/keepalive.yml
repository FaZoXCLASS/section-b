name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 08:00 UTC every 3 days
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        run: |
          echo "Pinging Supabase RPC ping() function to prevent 7-day inactivity pause..."
          
          # Nettoyage automatique pour tolérer les erreurs de saisie (/rest/v1 ou slash de fin)
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL="${RAW_URL%/}"
          CLEAN_URL="${CLEAN_URL%/rest/v1}"
          CLEAN_URL="${CLEAN_URL%/}"

          echo "Target endpoint: ${CLEAN_URL}/rest/v1/rpc/ping"

          STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${CLEAN_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP Status: $STATUS"
          cat response.txt

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo ""
            echo "SUCCESS: Supabase project successfully kept alive!"
          else
            echo ""
            echo "ERROR: Ping failed with status $STATUS"
            exit 1
          fi
