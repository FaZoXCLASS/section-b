<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1e" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="48" height="48" rx="10" fill="url(#bgGrad)" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Engineering Drafting Compass / Civil Engineering Symbol -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- H-Beam / Column blueprint marks -->
    <path d="M14 36 L14 12 M34 36 L34 12" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2"/>
    <!-- Compass apex -->
    <circle cx="24" cy="14" r="3" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Compass legs -->
    <path d="M22 16 L12 38" />
    <path d="M26 16 L36 38" />
    <!-- Crossbar divider -->
    <path d="M16 28 L32 28" stroke-width="2" />
  </g>
</svg>
